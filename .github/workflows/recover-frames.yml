name: Recover verified in-game frames

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: write
  actions: read

jobs:
  recover:
    if: contains(github.event.head_commit.message, '[frames-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-server-smoke
          run-id: 42465807306
          github-token: ${{ github.token }}
          path: recovered
      - name: Put the untouched CI frames into the branch for visual review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci_frames
          find recovered -maxdepth 1 -name '*.png' -exec cp {} reports/ci_frames/ \;
          test -s reports/ci_frames/elisar-armory-aurite.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ci_frames
          git commit -m "Add untouched in-game CI frames [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
