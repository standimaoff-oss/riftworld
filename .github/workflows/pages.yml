name: Publish the armour editor site

# Сайт-редактор брони (tools/armor_editor) — статические файлы.
# Публикуем их на GitHub Pages, чтобы ссылкой можно было пользоваться
# прямо из чата, без локального запуска.
on:
  push:
    branches: ["arena/**"]
    paths:
      - 'tools/armor_editor/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: riftworld-pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
        with:
          path: tools/armor_editor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/armor_editor
      - id: deploy
        uses: actions/deploy-pages@v4
