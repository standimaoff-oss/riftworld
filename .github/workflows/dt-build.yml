name: Build jars (mod + Dynamic Trees addon)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mod/build.gradle'
      - '.github/workflows/dt-build.yml'

permissions:
  contents: read

jobs:
  jars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both jars
        run: |
          cd mod
          chmod +x gradlew
          set -o pipefail
          ./gradlew dtInfo --no-daemon --console=plain 2>&1 | tee ../dt-build.log || true
          ./gradlew jar dtJar --no-daemon --console=plain --info 2>&1 | tee -a ../dt-build.log
      - name: Show results
        if: always()
        run: |
          echo "== DTINFO / mods.toml =="
          grep -iE "DTINFO|mods\.toml" dt-build.log | head -60
          echo "== jars =="
          ls -la mod/build/libs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jars
          path: |
            mod/build/libs/*.jar
            dt-build.log
