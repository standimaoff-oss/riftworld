name: Build Riftworld Mod

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          cd mod
          chmod +x gradlew
          ./gradlew jar --no-daemon

      - name: Prepare release asset
        if: success()
        run: |
          mkdir -p release
          echo "Listing all jar files:"
          find mod/build -type f -name "*.jar"
          JAR_FILE=$(find mod/build/libs -type f -name "*.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "No jar found in mod/build/libs! Searching whole mod directory:"
            find mod -type f -name "*.jar"
            exit 1
          fi
          echo "Using jar: $JAR_FILE"
          cp "$JAR_FILE" release/riftworld-0.6.4-p16.jar
          ls -lh release/riftworld-0.6.4-p16.jar

      - name: Upload mod jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riftworld-0.6.4-p16
          path: release/riftworld-0.6.4-p16.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.6.4-p16 --yes || true
          git tag -d v0.6.4-p16 || true
          git push origin :refs/tags/v0.6.4-p16 || true
          gh release create v0.6.4-p16 release/riftworld-0.6.4-p16.jar \
            --title "RiftWorld 0.6.4-p16 (Великий храм + Чёрный пролом пространства)" \
            --notes "### Обновление Riftworld 0.6.4-p16:
          - **Великий храм в Элисаре (город)**: полностью возведён из новых блоков мода (габариты 77×112×84, 33 040 блоков). Трёхневая базилика, 12 гранд-колонн с золотыми капителями, нервюрные своды, световой купол со шпилем, спящие духи храма, кованые люстры, процессионная рунная дорожка, подземная крипта.
          - **Ритуал телепортации**: зажжение 8 ритуальных свечей вокруг mosaic_core, стадии зарядки, сотрясение пространства и разрыв пространственно-временной ткани.
          - **Чёрный пролом пространства**: кастомный рендерер портала сингулярности (непроглядная чёрная бездна, свивающиеся кольца космического горизонта, горящая пульсирующая кромка, пространственные трещины и осколки реальности).
          - **Двусторонняя связь миров**: Overworld (заросшие руины храма) <-> Elisar (Великий храм) с сохранением позиции."
