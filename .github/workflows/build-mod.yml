name: Build Riftworld Mod

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon || ./gradlew clean build --no-daemon || ./gradlew clean build --no-daemon

      - name: Verify jar
        run: ls -la mod/build/libs/ || echo "NO JAR FOUND"

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riftworld-mod
          path: mod/build/libs/*.jar
          if-no-files-found: error
