name: Build Riftworld Mod

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          cd mod
          chmod +x gradlew
          ./gradlew jar --no-daemon 2>&1 | tee ../build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Gradle build failed!"
            exit 1
          fi

      - name: Report failure on error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -C 5 -E "(error:|FAILURE:|FAILED)" build.log | head -n 100 > /tmp/err.txt
          gh issue create --title "Gradle Compile Error" --body-file /tmp/err.txt || true

      - name: Prepare release asset
        if: success()
        run: |
          mkdir -p release
          echo "Finding jar in mod/build/libs:"
          find mod/build/libs -type f -name "*.jar"
          JAR_FILE=$(find mod/build/libs -type f -name "*.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No jar produced in mod/build/libs!"
            exit 1
          fi
          cp "$JAR_FILE" release/riftworld-0.6.4-p17.jar
          ls -lh release/riftworld-0.6.4-p17.jar

      - name: Upload mod jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riftworld-0.6.4-p17
          path: release/riftworld-0.6.4-p17.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close 4 || true
          gh issue close 5 || true
          gh release delete v0.6.4-p17 --yes || true
          git tag -d v0.6.4-p17 || true
          git push origin :refs/tags/v0.6.4-p17 || true
          gh release create v0.6.4-p17 release/riftworld-0.6.4-p17.jar \
            --title "RiftWorld 0.6.4-p17 (Уникальный 3D Пролом + 3D Мозаика + Соборный Великий Храм)" \
            --notes "### Обновление Riftworld 0.6.4-p17:
          - **УНИКАЛЬНЫЙ 3D ПРОЛОМ ПРОСТРАНСТВА (НЕ ИЗ БЛОКОВ)**:
            - Портал теперь представляет собой свободно парящий в воздухе органический вертикальный разлом пространства высотой 4.5м.
            - Никаких квадратных блоков: органическая зубчатая форма с гармонической турбулентностью, непроглядная чёрная сингулярность, наклоненные в 3D аккреционные кольца горизонта событий, горящая кромка, ветвящиеся пространственные молнии и втягивающиеся 3D осколки реальности.
          - **УНИКАЛЬНАЯ 3D МОЗАИКА НА ПОЛУ (MosaicCoreRenderer)**:
            - На полу святилища рендерится полноценная 3D модель ритуального астролябического циферблата с золотыми концентрическими кольцами, 8 постаментами под свечи, вращающимися шкалами и углубленными каналами, заполняющимися жидким светом по мере зарядки ритуала, а в центре парит вращающийся 3D кристалл Ядра Разлома.
          - **КАРДИНАЛЬНАЯ ПЕРЕРАБОТКА ХРАМОВЫХ СТРУКТУР**:
            - Полностью переработана архитектура Великого храма в городе: готическо-базиликальный собор со стрельчатыми нервюрными сводами, наружными аркбутанами и контрфорсами, открытыми звонницами с колоколами, световым купольным барабаном и полукруглой апсидой.
            - Переработаны руины храма в Обычном мире: атмосферные сводчатые руины с парящим органическим 3D разломом."
