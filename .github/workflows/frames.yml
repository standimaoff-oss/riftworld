name: In-game creature frames

# Real Minecraft-client screenshots of the rebuilt creatures. The frames are
# captured with the shipped jars on a disposable Forge server and published as
# release assets, so they can be linked from the report.
on:
  push:
    branches: ["arena/**"]
    # Пуши, которые трогают только собранные jar, не требуют новой съёмки:
    # без этого frames коммитит кадры обратно в ветку, его коммит снова
    # запускает frames, и проверка sea-check не доходит до конца.
    paths-ignore:
      - 'release/**'
      # Правки только инструментов CI не меняют то, что попадёт в кадр:
      # съёмку запускает отдельный коммит с самим модом.
      - 'tools/ci/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riftworld-frames-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the same jars the release ships
        shell: bash
        run: |
          cd mod
          chmod +x gradlew
          for attempt in 1 2 3; do
            # clean обязателен: иначе в mod/build/libs может остаться jar
            # предыдущей сборки, и сервер получит старый код витрины.
            ./gradlew clean jar dtJar --no-daemon --console=plain 2>&1 | tee ../build-ci.log && exit 0
            sleep 5
          done
          exit 1
      - name: Expose compiler errors in check annotations
        # Логи джобы через API отдают EOF, поэтому ошибки компиляции
        # выкладываем в аннотации — их читать можно.
        if: failure()
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p = Path('build-ci.log')
          if not p.exists():
              p = Path('mod/build-ci.log')
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              for i, line in enumerate(lines):
                  if (' error:' in line or ' error: ' in line
                          or line.startswith('FAILURE:') or 'What went wrong:' in line
                          or 'symbol:' in line or 'location:' in line):
                      text = ' | '.join(lines[i:i+4]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Build diagnostic::' + text[:3000])
          PYCODE
      - name: Boot a disposable Forge server
        shell: bash
        env:
          KEEP: '1'
          NORMAL_PROBE: '0'
        run: bash tools/ci/server_check.sh
      - name: Capture in-game frames
        shell: bash
        run: bash tools/ci/creature_frames.sh
      - name: Publish the frames next to the jar
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(grep -E '^mod_version=' mod/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          ls -l ci-out/frames || true
          if ls ci-out/frames/*.png >/dev/null 2>&1; then
            if ! gh release view "v$VER" >/dev/null 2>&1; then
              gh release create "v$VER" --title "v$VER" \
                --notes "Сборка Riftworld v$VER (Minecraft Forge 1.20.1)." --target "${{ github.sha }}"
            fi
            gh release upload "v$VER" ci-out/frames/*.png --clobber
          fi
      - name: Commit the frames into the branch for review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          VER=$(grep -E '^mod_version=' mod/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if ! ls ci-out/frames/*.png >/dev/null 2>&1; then echo "no frames to commit"; exit 0; fi
          mkdir -p "reports/ingame/$VER"
          cp ci-out/frames/*.png "reports/ingame/$VER/"
          git config user.name "riftworld-ci"
          git config user.email "ci@riftworld.invalid"
          git add "reports/ingame/$VER"
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Capture v$VER in-game frames [skip ci]"
          # Одновременно с нами в ветвь пушат джобы sea-check: принимаем их
          # состояние и пересоздаём коммит на новой базе.
          for try in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 10
            # fetch/reset могут упасть, если ветвь двигается прямо сейчас.
            # Под set -e любая такая ошибка убила бы всю джобу, поэтому
            # гасим её и просто пробуем снова.
            git fetch origin "refs/heads/${{ github.ref_name }}" || continue
            git reset --mixed FETCH_HEAD || continue
            git add -A "reports/ingame/$VER"
            git diff --cached --quiet && { echo "nothing new"; exit 0; }
            git commit -m "Capture v$VER in-game frames [skip ci]" || continue
          done
          echo "НЕ УДАЛОСЬ запушить кадры за 5 попыток"
          exit 1
      - name: Publish the frames diagnostics to the working branch
        # Артефакты джобы читать неудобно: журналы и отчёты проб кладём в ветвь,
        # чтобы падение кадра можно было расследовать по тексту.
        if: always() && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: bash tools/ci/publish_frames.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-frames
          path: |
            ci-out/frames/
            ci-out/frames-client.log
            ci-out/frames-capture.log
            ci-out/*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the test server
        if: always()
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
