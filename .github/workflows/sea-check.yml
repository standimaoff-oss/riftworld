name: Build + live Minecraft check

# Собирает мод, поднимает настоящий Forge-сервер с ним, проверяет измерение Элисар по RCON
# и коммитит отчёт в ветку ci-artifacts.
# NB: workflow_dispatch требует файла на default-ветке, поэтому основной триггер — push в arena/**.
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег релиза для jar (пусто = не публиковать релиз)'
        type: string
        required: false
        default: ''
      release_title:
        description: 'Заголовок релиза'
        type: string
        required: false
        default: ''
      iteration:
        description: 'Номер итерации для reports/iteration-N (пусто = следующий по счёту)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sea-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Коммит кадров в reports/ тоже пушит в эту ветку — без [skip ci] и этой проверки
    # прогон запускал бы сам себя бесконечно.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          set -o pipefail   # без этого падение gradle маскировалось tee, и джоб шёл дальше «успешным»
          mkdir -p ci-out
          cd mod
          chmod +x gradlew
          ./gradlew jar dtJar copyDTJar --no-daemon --console=plain -PwithDT 2>&1 | tee ../ci-out/build.log
        continue-on-error: false

      - name: Boot Forge server with the mod and probe it
        id: server
        # Рев 13.21: серверный шаг не должен «съедать» весь прогон: даже если он упал,
        # шаг клиента пытается отработать (у него if: always()) и его отчёт попадает в артефакты.
        continue-on-error: true
        run: bash tools/ci/server_check.sh
        env:
          WITH_DT: "1"   # Рев 12: сервер тоже с Dynamic Trees + аддоном

      # без игрока в измерении сервер Элисар не генерирует — съёмка и настоящие пробы идут в шаге клиента

      - name: Launch real Minecraft client, enter Elisar and take screenshots
        if: always()
        timeout-minutes: 50
        env:
          WITH_DT: "1"   # Рев 12: реальная проверка аддона Dynamic Trees — сервер и клиент с DT
        run: bash tools/ci/client_check.sh

      - name: Проверка серверного шага
        if: always()
        # Итог серверного шага выносим отдельной аннотацией: continue-on-error скрывает статус.
        run: |
          echo "server outcome: ${{ steps.server.outcome }}"
          if [ "${{ steps.server.outcome }}" != "success" ]; then
            echo "::error title=сервер::шаг сервера: ${{ steps.server.outcome }} — см. report_server.md в артефактах"
            exit 1
          fi

      - name: Stage jar for artifacts
        if: always()
        run: |
          mkdir -p ci-out
          JAR=$(ls mod/build/libs/riftworld-*.jar 2>/dev/null | grep -v -e sources -e javadoc | head -1 || true)
          if [ -n "$JAR" ]; then cp "$JAR" "ci-out/$(basename "$JAR")"; echo "staged $JAR"; fi
          DTJAR=$(ls mod/build/libs/riftworld-dt-*.jar 2>/dev/null | grep -v -e sources -e javadoc | head -1 || true)
          if [ -n "$DTJAR" ]; then cp "$DTJAR" "ci-out/$(basename "$DTJAR")"; echo "staged addon $DTJAR"; fi

      - name: Resolve release tag
        id: tag
        if: always()
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git log -1 --pretty=%B | sed -n 's/.*\[release \([^]]*\)\].*/\1/p')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: [$TAG]"

      - name: Publish jar as a GitHub release
        if: success() && steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="${{ inputs.release_title }}"
          JAR=$(ls mod/build/libs/riftworld-*.jar | grep -v -e sources -e javadoc | head -1 || true)
          NOTES=ci-out/report.md
          [ -f "$NOTES" ] || NOTES=ci-shots/report_client.md
          [ -f "$NOTES" ] || NOTES=ci-out/report_client.md
          [ -f "$NOTES" ] || { printf '%s\n' "Живое море Элисара: релиз $TAG" > ci-out/notes.md; NOTES=ci-out/notes.md; }
          {
            set -x
            [ -n "$JAR" ] || { echo "jar не найден"; exit 1; }
            cp "$JAR" "ci-out/riftworld-$TAG.jar"
            DTJAR=$(ls mod/build/libs/riftworld-dt-*.jar 2>/dev/null | head -1 || true)
            [ -n "$DTJAR" ] && cp "$DTJAR" "ci-out/riftworld-dt-$TAG.jar" || true
            echo "notes: $NOTES ($(wc -c < "$NOTES" 2>/dev/null || echo none) байт)"
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" "ci-out/riftworld-$TAG.jar" "ci-out/riftworld-dt-$TAG.jar" --title "${TITLE:-$TAG}" --notes-file "$NOTES"
          } > ci-out/release.log 2>&1 || {
            echo "== публикация релиза не удалась =="
            tail -40 ci-out/release.log
            exit 1
          }

      # Рев 14: владелец попросил складывать кадры прямо в репозиторий, в reports/iteration-N —
      # чтобы на каждый кадр можно было дать прямую ссылку с GitHub, а не искать артефакт прогона.
      - name: Publish screenshots to reports/iteration-N
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          SHOTS=(ci-shots/*.jpg)
          if [ ${#SHOTS[@]} -eq 0 ]; then
            echo "нет кадров — публиковать нечего"
            exit 0
          fi
          # номер итерации: из входа workflow_dispatch или следующий по счёту в reports/
          IT="${{ inputs.iteration }}"
          if [ -z "$IT" ]; then
            LAST=$(ls -d reports/iteration-* 2>/dev/null | sed 's#.*iteration-##' | sort -n | tail -1)
            IT=$(( ${LAST:-0} + 1 ))
          fi
          DEST="reports/iteration-$IT"
          echo "публикую ${#SHOTS[@]} кадров в $DEST"
          mkdir -p "$DEST/shots"
          # сжимаем до 854 px по ширине, чтобы кадры не раздували репозиторий
          for f in "${SHOTS[@]}"; do
            convert "$f" -resize 854x -quality 78 "$DEST/shots/$(basename "$f")" 2>/dev/null \
              || cp "$f" "$DEST/shots/$(basename "$f")"
          done
          cp ci-shots/probes.txt "$DEST/" 2>/dev/null || true
          # jar этой итерации кладём рядом с кадрами: на него тоже нужна прямая ссылка в сообщении
          JAR=$(ls mod/build/libs/riftworld-*.jar 2>/dev/null | grep -v -e sources -e javadoc | head -1 || true)
          [ -n "$JAR" ] && cp "$JAR" "$DEST/$(basename "$JAR")" || echo "jar не найден — пропускаю"
          DTJAR=$(ls mod/build/libs/riftworld-dt-*.jar 2>/dev/null | head -1 || true)
          [ -n "$DTJAR" ] && cp "$DTJAR" "$DEST/$(basename "$DTJAR")" || true
          cp ci-shots/report_client.md "$DEST/" 2>/dev/null || true
          cp ci-out/report.md "$DEST/" 2>/dev/null || true
          # индекс с прямыми ссылками на каждый кадр
          {
            echo "# Итерация $IT — кадры живого прогона"
            echo
            echo "Прогон: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "Коммит: \`${{ github.sha }}\`"
            echo
            if ls "$DEST"/*.jar >/dev/null 2>&1; then
              echo
              echo "## Jar этой итерации"
              for j in "$DEST"/*.jar; do
                echo "- [$(basename "$j")](../$DEST/$(basename "$j"))"
              done
            fi
            echo
            echo "## Кадры"
            for f in "$DEST"/shots/*.jpg; do
              n=$(basename "$f")
              echo "- [$n](../$DEST/shots/$n)"
            done
          } > "$DEST/README.md"
          git config user.name "riftworld-ci"
          git config user.email "riftworld-ci@users.noreply.github.com"
          git add -A "$DEST"
          if git diff --cached --quiet; then
            echo "кадры не изменились"
            exit 0
          fi
          git commit -qm "кадры итерации $IT (прогон #${{ github.run_number }}) [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}" || echo "::warning title=reports::push кадров не прошёл"
          echo "готово: $DEST"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-out/
          if-no-files-found: warn

      - name: Commit report to ci-artifacts branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "riftworld-ci"
          git config user.email "riftworld-ci@users.noreply.github.com"
          rm -rf /tmp/artifacts
          mkdir -p /tmp/artifacts
          cp -r ci-out/. /tmp/artifacts/ 2>/dev/null || echo "нет ci-out (шаг сборки упал раньше)"
          cp -r ci-shots/. /tmp/artifacts/shots/ 2>/dev/null || echo "нет ci-shots (клиент не дошёл до снимков)"
          echo "артефактов: $(find /tmp/artifacts -type f | wc -l)"
          # Рев 13: раньше push в ветку отчёта тихо падал и разбирать прогон было нечем.
          git checkout --orphan ci-artifacts
          git rm -rf -q --cached . >/dev/null 2>&1 || true
          rm -rf ./* ./.github 2>/dev/null || true
          cp -r /tmp/artifacts/* .
          git add -A
          git commit -qm "CI artifacts for ${{ github.sha }} (${{ github.run_number }})" || echo "нечего коммитить"
          if git push -f origin HEAD:ci-artifacts 2>/tmp/push.log; then
            echo "отчёт залит в ветку ci-artifacts: $(git rev-parse --short HEAD)"
          else
            echo "::error title=ci-artifacts::push не прошёл: $(tail -3 /tmp/push.log | tr '\n' ' ')"
            cat /tmp/push.log
          fi
          echo "jar в ветке: $(ls -1 *.jar 2>/dev/null | head -1)"
