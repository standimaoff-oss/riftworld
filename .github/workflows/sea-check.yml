name: Build and smoke-test Riftworld

on:
  push:
    branches: ["arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riftworld-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check model, animation envelopes and island safety rules
        shell: bash
        run: |
          python -m pip install numpy pillow
          python reports/el_gran_maja_model/validate_el_gran_maja_model.py
          python reports/el_gran_maja_model/validate_collision_bounds.py
          mkdir -p /tmp/maja-unit
          javac -d /tmp/maja-unit mod/src/main/java/ru/aiforge/riftworld/world/DeepOcean.java mod/src/main/java/ru/aiforge/riftworld/world/MajaSafetyPolicy.java tests/java/MajaRulesTest.java
          java -cp /tmp/maja-unit MajaRulesTest
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package both mods
        shell: bash
        run: |
          set -o pipefail
          cd mod
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew jar dtJar majaSafetyCheck --no-daemon --console=plain 2>&1 | tee ../build-ci.log; then
              exit 0
            fi
            # A javac error is deterministic; retries are only for transient Maven errors.
            grep -q 'Task :compileJava FAILED' ../build-ci.log && exit 1
            sleep 15
          done
          exit 1
      - name: Expose compiler errors in check annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p = Path('build-ci.log')
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              for i, line in enumerate(lines):
                  if ' error:' in line or line.startswith('FAILURE:') or 'What went wrong:' in line:
                      text = ' | '.join(lines[i:i+4]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Build diagnostic::' + text[:3000])
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-build
          path: |
            mod/build/libs/*.jar
            build-ci.log
          if-no-files-found: warn
          retention-days: 14

  server-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/64445ff0-riftworld' && contains(github.event.head_commit.message, '[maja-export]')
      - name: Boot a real Forge server and probe it
        shell: bash
        env:
          KEEP: '1'
          NORMAL_PROBE: '0'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - name: Verify Maja motion and block/border collisions on the server
        shell: bash
        run: bash tools/ci/maja_server_probe.sh
      - name: Real client rendering smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/64445ff0-riftworld' && contains(github.event.head_commit.message, '[maja-export]')
        shell: bash
        run: bash tools/ci/maja_client_probe.sh
      - name: Stop the test server
        if: always()
        shell: bash
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-server-smoke
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14

  export-tested-jar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/64445ff0-riftworld' && contains(github.event.head_commit.message, '[maja-export]')
    needs: [build, server-smoke]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-server-smoke
          path: test-artifact
      - name: Export exactly the tested jar and screenshot to the current branch
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo 'Branch changed during the test; refusing to export'; exit 1; }
          mapfile -t jars < <(find build-artifact -type f -name 'riftworld-*.jar' ! -name 'riftworld-dt-*' ! -name '*sources*' ! -name '*javadoc*')
          [ "${#jars[@]}" = 1 ] || { echo 'Expected exactly one primary mod jar'; exit 1; }
          shot=$(find test-artifact -name 'maja-client-front.png' -type f -print -quit)
          [ -n "$shot" ] || { echo 'Missing client screenshot'; exit 1; }
          mkdir -p release reports/el_gran_maja_model
          cp "${jars[0]}" "release/$(basename "${jars[0]}")"
          mapfile -t addons < <(find build-artifact -type f -name 'riftworld-dt-*.jar' ! -name '*sources*' ! -name '*javadoc*')
          [ "${#addons[@]}" = 1 ] || { echo 'Expected exactly one optional addon jar'; exit 1; }
          cp "${addons[0]}" "release/$(basename "${addons[0]}")"
          (cd release && sha256sum riftworld-0.40.0.jar riftworld-dt-0.40.0.jar > riftworld-0.40.0.sha256)
          cp "$shot" reports/el_gran_maja_model/09_game_client_front.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/riftworld-0.40.0.jar release/riftworld-dt-0.40.0.jar release/riftworld-0.40.0.sha256 reports/el_gran_maja_model/09_game_client_front.png
          git diff --cached --quiet && exit 0
          git commit -m 'Export tested Riftworld mod and client capture [skip ci]'
          git push origin HEAD:refs/heads/arena/64445ff0-riftworld
