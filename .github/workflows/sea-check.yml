name: Build and smoke-test Riftworld

on:
  push:
    branches: ["arena/**"]
    paths-ignore:
      - 'release/**'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riftworld-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check model, animation envelopes and island safety rules
        shell: bash
        run: |
          python -m pip install numpy pillow
          python reports/el_gran_maja_model/validate_el_gran_maja_model.py
          python reports/el_gran_maja_model/validate_collision_bounds.py
          python tools/rift/validate_reference_fauna.py
          mkdir -p /tmp/maja-unit
          javac -d /tmp/maja-unit mod/src/main/java/ru/aiforge/riftworld/world/DeepOcean.java mod/src/main/java/ru/aiforge/riftworld/world/MajaSafetyPolicy.java tests/java/MajaRulesTest.java tests/java/DeepOceanCoreTest.java
          java -cp /tmp/maja-unit MajaRulesTest
          java -cp /tmp/maja-unit DeepOceanCoreTest
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package both mods
        shell: bash
        run: |
          set -o pipefail
          cd mod
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew jar dtJar majaSafetyCheck --no-daemon --console=plain 2>&1 | tee ../build-ci.log; then
              exit 0
            fi
            # A javac error is deterministic; retries are only for transient Maven errors.
            grep -q 'Task :compileJava FAILED' ../build-ci.log && exit 1
            sleep 15
          done
          exit 1
      - name: Expose compiler errors in check annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p = Path('build-ci.log')
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              for i, line in enumerate(lines):
                  if ' error:' in line or line.startswith('FAILURE:') or 'What went wrong:' in line:
                      text = ' | '.join(lines[i:i+4]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Build diagnostic::' + text[:3000])
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-build
          path: |
            mod/build/libs/*.jar
            build-ci.log
          if-no-files-found: warn
          retention-days: 14

  server-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arena/361da66e-riftworld'
      - name: Boot a real Forge server and probe it
        shell: bash
        env:
          KEEP: '1'
          NORMAL_PROBE: '0'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - name: Verify Maja motion and block/border collisions on the server
        shell: bash
        run: bash tools/ci/maja_server_probe.sh
      - name: Verify creature trophy drops
        shell: bash
        run: bash tools/ci/fauna_server_probe.sh
      - name: Real client rendering smoke test
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arena/361da66e-riftworld'
        shell: bash
        run: bash tools/ci/maja_client_probe.sh
      - name: Stop the test server
        if: always()
        shell: bash
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-server-smoke
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14

  candidate-profile:
    needs: build
    if: github.ref == 'refs/heads/arena/361da66e-riftworld'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - name: Boot candidate on a fresh disposable server
        env:
          KEEP: '1'
          NORMAL_PROBE: '0'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - name: Profile candidate generation and collision
        run: bash tools/ci/perf_probe.sh
      - name: Stop server
        if: always()
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-performance-profile
          path: ci-out/
          if-no-files-found: warn

  addon-smoke:
    needs: build
    if: github.ref == 'refs/heads/arena/361da66e-riftworld'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - name: Boot Forge with Dynamic Trees and the add-on
        env:
          KEEP: '0'
          NORMAL_PROBE: '0'
          WITH_DT: '1'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-addon-smoke
          path: ci-out/
          if-no-files-found: warn


  temporary-export-diagnostics:
    needs: [build, server-smoke, candidate-profile, addon-smoke]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/arena/361da66e-riftworld' && needs.build.result == 'success' && needs.server-smoke.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: exported
      - name: Export diagnostics and successful candidate
        env:
          ALL_OK: ${{ needs.server-smoke.result == 'success' && needs.candidate-profile.result == 'success' && needs.addon-smoke.result == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p reports/check-0.41.4
          for f in fauna-liopleurodon.png fauna-liopleurodon-motion.png fauna-pegasus-motion.png fauna-pegasus-unsaddled.png fauna-pegasus-saddled.png maja-natural-diagnostic.txt predator-test.txt performance.txt; do
            path=$(find exported -name "$f" -print -quit)
            [ -z "$path" ] || cp "$path" "reports/check-0.41.4/$f"
          done
          logfile=$(find exported -name maja-client.log -print -quit)
          [ -z "$logfile" ] || tail -300 "$logfile" > reports/check-0.41.4/client-tail.log
          if [ "$ALL_OK" = true ]; then
            mkdir -p release
            cp "$(find exported -name 'riftworld-0.41.4.jar' -print -quit)" release/
            cp "$(find exported -name 'riftworld-dt-0.41.4.jar' -print -quit)" release/
            sha256sum release/riftworld-0.41.4.jar release/riftworld-dt-0.41.4.jar > release/riftworld-0.41.4.sha256
            git add release/riftworld-0.41.4.jar release/riftworld-dt-0.41.4.jar release/riftworld-0.41.4.sha256
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/check-0.41.4/
          git diff --cached --quiet || git commit -m 'Export 0.41.4 check evidence [skip ci]'
          git pull --rebase origin arena/361da66e-riftworld
          git push origin HEAD:refs/heads/arena/361da66e-riftworld
