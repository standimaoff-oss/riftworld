name: Build and smoke-test Riftworld

on:
  push:
    branches: ["arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riftworld-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check model, animation envelopes and island safety rules
        shell: bash
        run: |
          python -m pip install numpy pillow
          python reports/el_gran_maja_model/validate_el_gran_maja_model.py
          python reports/el_gran_maja_model/validate_collision_bounds.py
          python reports/el_gran_maja_model/verify_head_details.py
          mkdir -p /tmp/maja-unit
          javac -d /tmp/maja-unit mod/src/main/java/ru/aiforge/riftworld/world/DeepOcean.java mod/src/main/java/ru/aiforge/riftworld/world/MajaSafetyPolicy.java tests/java/MajaRulesTest.java
          java -cp /tmp/maja-unit MajaRulesTest
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package both mods
        shell: bash
        run: |
          set -o pipefail
          cd mod
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew jar dtJar majaSafetyCheck --no-daemon --console=plain 2>&1 | tee ../build-ci.log; then
              exit 0
            fi
            # A javac error is deterministic; retries are only for transient Maven errors.
            grep -q 'Task :compileJava FAILED' ../build-ci.log && exit 1
            sleep 15
          done
          exit 1
      - name: Expose compiler errors in check annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p = Path('build-ci.log')
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              for i, line in enumerate(lines):
                  if ' error:' in line or line.startswith('FAILURE:') or 'What went wrong:' in line:
                      text = ' | '.join(lines[i:i+4]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Build diagnostic::' + text[:3000])
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-build
          path: |
            mod/build/libs/*.jar
            build-ci.log
          if-no-files-found: warn
          retention-days: 14

  server-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot a real Forge server and probe it
        shell: bash
        env:
          KEEP: '1'
          NORMAL_PROBE: '0'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - name: Verify Maja motion and block/border collisions on the server
        shell: bash
        run: bash tools/ci/maja_server_probe.sh
      - name: Real client Xvfb + Mesa llvmpipe probe for Blockbench Liopleurodon & Pegasus
        shell: bash
        run: bash tools/ci/blockbench_models_probe.sh
      - name: Real client rendering smoke test
        # Runs on every arena working branch push so the El Gran Maja head shots
        # (front cheeks, 3/4 cheeks, sealed rear skull) stay reviewable.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: bash tools/ci/maja_client_probe.sh
      - name: Stop the test server
        if: always()
        shell: bash
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
      - name: Publish Xvfb + Mesa llvmpipe screenshots to working branch
        if: always() && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: |
          changed=0
          if [ -d ci-out/blockbench_shots ] && [ -n "$(ls -A ci-out/blockbench_shots 2>/dev/null)" ]; then
            mkdir -p reports/blockbench_models/ingame
            cp -a ci-out/blockbench_shots/* reports/blockbench_models/ingame/
            git add reports/blockbench_models/ingame/
            changed=1
          fi
          if ls ci-out/maja-client-*.png >/dev/null 2>&1; then
            mkdir -p reports/el_gran_maja_model/ingame
            cp -a ci-out/maja-client-*.png reports/el_gran_maja_model/ingame/
            git add reports/el_gran_maja_model/ingame/
            changed=1
          fi
          if [ "$changed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git diff --cached --quiet; then
              git commit -m "Add Xvfb + Mesa llvmpipe in-game screenshots [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-server-smoke
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14
