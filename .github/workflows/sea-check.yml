name: Build and smoke-test Riftworld

on:
  push:
    branches: ["arena/**"]
    paths-ignore:
      - 'release/**'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riftworld-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check model, animation envelopes and island safety rules
        shell: bash
        run: |
          python -m pip install numpy pillow
          python reports/el_gran_maja_model/validate_el_gran_maja_model.py
          python reports/el_gran_maja_model/validate_collision_bounds.py
          python tools/rift/validate_reference_fauna.py
          mkdir -p /tmp/maja-unit
          javac -d /tmp/maja-unit mod/src/main/java/ru/aiforge/riftworld/world/DeepOcean.java mod/src/main/java/ru/aiforge/riftworld/world/MajaSafetyPolicy.java tests/java/MajaRulesTest.java
          java -cp /tmp/maja-unit MajaRulesTest
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package both mods
        shell: bash
        run: |
          set -o pipefail
          cd mod
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew jar dtJar majaSafetyCheck --no-daemon --console=plain 2>&1 | tee ../build-ci.log; then
              exit 0
            fi
            # A javac error is deterministic; retries are only for transient Maven errors.
            grep -q 'Task :compileJava FAILED' ../build-ci.log && exit 1
            sleep 15
          done
          exit 1
      - name: Expose compiler errors in check annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p = Path('build-ci.log')
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              for i, line in enumerate(lines):
                  if ' error:' in line or line.startswith('FAILURE:') or 'What went wrong:' in line:
                      text = ' | '.join(lines[i:i+4]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Build diagnostic::' + text[:3000])
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-build
          path: |
            mod/build/libs/*.jar
            build-ci.log
          if-no-files-found: warn
          retention-days: 14

  server-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arena/361da66e-riftworld'
      - name: Boot a real Forge server and probe it
        shell: bash
        env:
          KEEP: '1'
          NORMAL_PROBE: '0'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - name: Verify Maja motion and block/border collisions on the server
        shell: bash
        run: bash tools/ci/maja_server_probe.sh
      - name: Verify creature trophy drops
        shell: bash
        run: bash tools/ci/fauna_server_probe.sh
      - name: Real client rendering smoke test
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arena/361da66e-riftworld'
        shell: bash
        run: bash tools/ci/maja_client_probe.sh
      - name: Stop the test server
        if: always()
        shell: bash
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-server-smoke
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14

  candidate-profile:
    needs: build
    if: github.ref == 'refs/heads/arena/361da66e-riftworld'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - name: Boot candidate on a fresh disposable server
        env:
          KEEP: '1'
          NORMAL_PROBE: '0'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - name: Profile candidate generation and collision
        run: bash tools/ci/perf_probe.sh
      - name: Stop server
        if: always()
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-performance-profile
          path: ci-out/
          if-no-files-found: warn

  addon-smoke:
    needs: build
    if: github.ref == 'refs/heads/arena/361da66e-riftworld'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - name: Boot Forge with Dynamic Trees and the add-on
        env:
          KEEP: '0'
          NORMAL_PROBE: '0'
          WITH_DT: '1'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-addon-smoke
          path: ci-out/
          if-no-files-found: warn

  # Temporary, branch-scoped exporter: commit only the tested build, short
  # profiles and review screenshots. No releases, tags, other branches or force pushes.
  publish-tested-artifacts:
    needs: [build, server-smoke, candidate-profile, addon-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/361da66e-riftworld'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: exported/build
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-server-smoke
          path: exported/client
      - uses: actions/download-artifact@v4
        with:
          name: candidate-performance-profile
          path: exported/candidate
      - uses: actions/download-artifact@v4
        with:
          name: released-performance-profile
          path: exported/baseline
          run-id: 41862935106
          github-token: ${{ github.token }}
      - name: Save tested jars and compact review evidence on this branch
        shell: bash
        run: |
          set -euo pipefail
          main=$(find exported/build -name 'riftworld-0.41.0.jar' -print -quit)
          addon=$(find exported/build -name 'riftworld-dt-0.41.0.jar' -print -quit)
          test -f "$main" && test -f "$addon"
          mkdir -p release reports/performance reports/reference_fauna/client
          cp "$main" release/riftworld-0.41.0.jar
          cp "$addon" release/riftworld-dt-0.41.0.jar
          sha256sum release/riftworld-0.41.0.jar release/riftworld-dt-0.41.0.jar > release/riftworld-0.41.0.sha256
          cp "$(find exported/baseline -name performance.txt -print -quit)" reports/performance/released-0.40.0.txt
          cp "$(find exported/candidate -name performance.txt -print -quit)" reports/performance/candidate-0.41.0.txt
          for image in fauna-liopleurodon.png fauna-pegasus-unsaddled.png fauna-pegasus-saddled.png fauna-trophy-held.png fauna-trophy-inventory.png; do
            cp "$(find exported/client -name "$image" -print -quit)" "reports/reference_fauna/client/$image"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/riftworld-0.41.0.jar release/riftworld-dt-0.41.0.jar release/riftworld-0.41.0.sha256 reports/performance/ reports/reference_fauna/client/
          if ! git diff --cached --quiet; then
            git commit -m 'Add tested Riftworld 0.41.0 artifacts [skip ci]'
            git push origin HEAD:refs/heads/arena/361da66e-riftworld
          fi
