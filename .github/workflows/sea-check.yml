name: Build and smoke-test Riftworld

on:
  push:
    branches: ["arena/**"]
    paths-ignore:
      - 'release/**'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riftworld-check-${{ github.ref }}
  # Do NOT cancel in progress: the frames workflow commits the captured PNGs
  # back into this branch while a build is still going, and cancelling there
  # left the release without its jars.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check model, animation envelopes and island safety rules
        shell: bash
        run: |
          python -m pip install numpy pillow
          python reports/el_gran_maja_model/validate_el_gran_maja_model.py
          python reports/el_gran_maja_model/validate_collision_bounds.py
          python tools/rift/validate_reference_fauna.py
          python tools/rift/validate_v047_fauna.py
          python tools/rift/validate_v048_armory_and_folk.py
          mkdir -p /tmp/maja-unit
          javac -d /tmp/maja-unit mod/src/main/java/ru/aiforge/riftworld/world/DeepOcean.java mod/src/main/java/ru/aiforge/riftworld/world/MajaSafetyPolicy.java tests/java/MajaRulesTest.java tests/java/DeepOceanCoreTest.java mod/src/main/java/ru/aiforge/riftworld/world/OceanWreck.java tests/java/OceanWreckTest.java mod/src/main/java/ru/aiforge/riftworld/world/MajaMotion.java tests/java/MajaMotionTest.java
          java -cp /tmp/maja-unit MajaRulesTest
          java -cp /tmp/maja-unit DeepOceanCoreTest
          java -cp /tmp/maja-unit OceanWreckTest
          java -cp /tmp/maja-unit MajaMotionTest
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package both mods
        shell: bash
        run: |
          set -o pipefail
          cd mod
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew jar dtJar majaSafetyCheck --no-daemon --console=plain 2>&1 | tee ../build-ci.log; then
              exit 0
            fi
            # A javac error is deterministic; retries are only for transient Maven errors.
            grep -q 'Task :compileJava FAILED' ../build-ci.log && exit 1
            sleep 15
          done
          exit 1
      - name: Expose compiler errors in check annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p = Path('build-ci.log')
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              for i, line in enumerate(lines):
                  if ' error:' in line or line.startswith('FAILURE:') or 'What went wrong:' in line:
                      text = ' | '.join(lines[i:i+4]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Build diagnostic::' + text[:3000])
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-build
          path: |
            mod/build/libs/*.jar
            build-ci.log
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - name: Collect jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          VER=$(grep -E '^mod_version=' mod/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VER=$VER" >> "$GITHUB_ENV"
          find build-artifact -name 'riftworld*.jar' -exec cp {} out/ \;
          cd out
          sha256sum *.jar > SHA256SUMS.txt
          ls -l
      - name: Publish the build as a GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VER"
          NOTES=$(mktemp)
          cat > "$NOTES" <<EOF
          Автоматическая сборка Riftworld **$TAG** (Minecraft Forge 1.20.1 / Java 17).

          - \`riftworld-$VER.jar\` — основной мод, ставится в \`mods\`.
          - \`riftworld-dt-$VER.jar\` — аддон к Dynamic Trees, только вместе с DT.
          - \`SHA256SUMS.txt\` — контрольные суммы.

          ### Концепт-референсы (AI)
          - \`01_elisar_sky_skiff_airship.png\` — небесный скифф Элисара над облачным морем (вариант 2 из 2).
          - \`02_riftcrystal_colossus_guardian.png\` — Рифткристальный колосс-страж с алебардой (вариант 1 из 2).
          - \`03_astral_forge_sanctum.png\` — кузня Астральной Кузни под звёздным куполом (вариант 2 из 2).

          Подробности версии — в [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md).
          Сборка и серверные пробы: [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.jar out/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" out/*.jar out/SHA256SUMS.txt --title "$TAG" --notes-file "$NOTES" --target "${{ github.sha }}"
          fi
          # v0.49.0: the three selected AI concept sheets are part of the release
          # deliverables — ship them next to the jars.
          if [ -d reports/concept_refs_v049 ]; then
            gh release upload "$TAG" reports/concept_refs_v049/*.png --clobber || \
              echo "::warning::could not upload the concept reference sheets"
          fi

  server-smoke:
    needs: build
    # Кадры и отчёты probe-скриптов публикуются прямо в ветвь: без write
    # прав на contents git push из джобы отказывается с 403.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arena/361da66e-riftworld' || github.ref == 'refs/heads/arena/b4294aa1-riftworld' || github.ref == 'refs/heads/arena/037a840e-riftworld'
      - name: Boot a real Forge server and probe it
        shell: bash
        env:
          KEEP: '1'
          NORMAL_PROBE: '0'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - name: Verify Maja motion and block/border collisions on the server
        shell: bash
        run: bash tools/ci/maja_server_probe.sh
      - name: Verify creature trophy drops
        shell: bash
        run: bash tools/ci/fauna_server_probe.sh
      - name: Verify ocean wreck in newly generated chunks
        run: bash tools/ci/ocean_wreck_probe.sh
      - name: Verify 120-block ocean and submerged Maja on the server
        run: bash tools/ci/deep_ocean_probe.sh
      - name: Real client rendering smoke test
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arena/361da66e-riftworld' || github.ref == 'refs/heads/arena/b4294aa1-riftworld' || github.ref == 'refs/heads/arena/037a840e-riftworld'
        shell: bash
        run: bash tools/ci/maja_client_probe.sh
      - name: Stop the test server
        if: always()
        shell: bash
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
      - name: Publish the in-game screenshots to the working branch
        # Кадры снимает настоящий клиент под Xvfb: держать их в ветке удобнее,
        # чем ходить за артефактами, — на них смотрят глазами при ревью.
        # Туда же попадают текстовые отчёты probe-скриптов.
        if: always() && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: bash tools/ci/publish_frames.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-server-smoke
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14

  maja-feeding:
    needs: build
    # Кадры и отчёты probe-скриптов публикуются прямо в ветвь: без write
    # прав на contents git push из джобы отказывается с 403.
    permissions:
      contents: write
    if: github.ref == 'refs/heads/arena/361da66e-riftworld' || github.ref == 'refs/heads/arena/b4294aa1-riftworld' || github.ref == 'refs/heads/arena/037a840e-riftworld'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - name: Run the always-enabled feeding titan on a disposable server
        run: |
          mkdir -p mod/build/libs ci/server/config
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          # v0.49.0: island eating is enabled by default; the probe still pins it
          # explicitly so the CI result does not depend on the generated default.
          printf '[maja]\nallowIslandEating = true\n' > ci/server/config/riftworld-maja.toml
          KEEP=1 NORMAL_PROBE=0 bash tools/ci/server_check.sh
      - name: Test a real medium island and mobGriefing gate
        run: bash tools/ci/maja_feeding_probe.sh
      - name: Save server diagnostics
        if: always()
        run: tail -500 ci/server/logs/latest.log > ci-out/feeding-server-tail.log || true
      - name: Publish the feeding report to the working branch
        # Отчёт probe-скрипта кладём в ветвь: по нему видно, какая именно
        # проверка не прошла, даже когда логи джобы недоступны.
        if: always() && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: bash tools/ci/publish_frames.sh
      - name: Stop server
        if: always()
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-maja-feeding
          path: ci-out/
          if-no-files-found: warn

  candidate-profile:
    needs: build
    if: github.ref == 'refs/heads/arena/361da66e-riftworld' || github.ref == 'refs/heads/arena/b4294aa1-riftworld'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - name: Boot candidate on a fresh disposable server
        env:
          KEEP: '1'
          NORMAL_PROBE: '0'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - name: Profile candidate generation and collision
        run: bash tools/ci/perf_probe.sh
      - name: Stop server
        if: always()
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-performance-profile
          path: ci-out/
          if-no-files-found: warn

  addon-smoke:
    needs: build
    if: github.ref == 'refs/heads/arena/361da66e-riftworld' || github.ref == 'refs/heads/arena/b4294aa1-riftworld'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: riftworld-build
          path: build-artifact
      - name: Boot Forge with Dynamic Trees and the add-on
        env:
          KEEP: '0'
          NORMAL_PROBE: '0'
          WITH_DT: '1'
        run: |
          mkdir -p mod/build/libs
          find build-artifact -name '*.jar' -exec cp {} mod/build/libs/ \;
          bash tools/ci/server_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftworld-addon-smoke
          path: ci-out/
          if-no-files-found: warn
