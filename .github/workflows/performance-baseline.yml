name: Profile released 0.40.0 baseline
on:
  push:
    branches: ['arena/361da66e-riftworld']
    paths:
      - '.github/workflows/performance-baseline.yml'
      - 'tools/ci/perf_probe.sh'
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Boot the already released jar
        shell: bash
        env:
          KEEP: '1'
          NORMAL_PROBE: '0'
        run: |
          mkdir -p mod/build/libs
          cp release/riftworld-0.40.0.jar mod/build/libs/
          bash tools/ci/server_check.sh
      - name: Profile old generation and collision
        run: bash tools/ci/perf_probe.sh
      - name: Export completed-chunk baseline on this branch
        run: |
          set -euo pipefail
          mkdir -p reports/performance
          cp ci-out/performance.txt reports/performance/released-0.40.0-ready.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/performance/released-0.40.0-ready.txt
          git diff --cached --quiet || git commit -m 'Export 0.40 baseline readiness profile [skip ci]'
          git pull --rebase origin arena/361da66e-riftworld
          git push origin HEAD:refs/heads/arena/361da66e-riftworld
      - name: Stop server
        if: always()
        run: python3 tools/rcon.py --password riftci --log '' --timeout 20 stop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-performance-profile
          path: ci-out/
          if-no-files-found: warn
